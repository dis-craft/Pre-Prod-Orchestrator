name: Pre-Prod Security Engine
description: Run the repository scanner and, when enabled, the existing AI remediation agent against the caller workspace.
inputs:
  scan-input:
    description: Structured Pre-Prod Tester scan JSON path.
    required: true
  generate-remediation:
    description: Whether AI remediation should be generated and applied.
    required: false
    default: "false"
  scan-output:
    description: Directory for the baseline scan report.
    required: false
    default: .preprod/baseline-scan
  remediation-output:
    description: Remediation result JSON path.
    required: false
    default: .preprod/remediation-result.json
  rescan-output:
    description: Directory for the post-remediation scan.
    required: false
    default: .preprod/post-remediation-scan
  model:
    description: Gemini model used by the remediation agent.
    required: false
    default: gemini-3.5-flash
  context-window:
    description: Number of surrounding source lines sent to the model.
    required: false
    default: "60"
  fallback-model:
    description: Secondary Gemini model used after primary retries.
    required: false
    default: gemini-2.5-flash
  primary-attempts:
    description: Primary Gemini model attempts.
    required: false
    default: "3"
  fallback-attempts:
    description: Secondary Gemini model attempts.
    required: false
    default: "2"
  full-repo-rescan:
    description: Scan the whole repository.
    required: false
    default: "false"
  reuse-findings:
    description: Reuse security findings already stored in the canonical scan artifact.
    required: false
    default: "false"
outputs:
  findings:
    description: Baseline findings JSON path.
    value: ${{ inputs.reuse-findings == 'true' && steps.canonical.outputs.findings || steps.scan.outputs.findings }}
  remediation:
    description: Remediation result JSON path.
    value: ${{ steps.remediate.outputs.result }}
runs:
  using: composite
  steps:
    - id: install
      name: Install security engine dependencies
      shell: bash
      run: |
        python3 -m pip install --disable-pip-version-check -q -r "$GITHUB_ACTION_PATH/../../../requirements.txt"

    - id: canonical
      name: Load canonical security findings
      if: ${{ inputs.reuse-findings == 'true' }}
      shell: bash
      env:
        SCAN_INPUT: ${{ inputs.scan-input }}
        SCAN_OUTPUT: ${{ inputs.scan-output }}
      run: |
        set -euo pipefail
        python3 - "$GITHUB_WORKSPACE/$SCAN_INPUT" "$GITHUB_WORKSPACE/$SCAN_OUTPUT/findings.json" <<'PY'
        import json, sys
        from pathlib import Path
        src = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        engine = src.get("security_engine")
        if not isinstance(engine, dict):
            raise SystemExit("Canonical scan has no security_engine findings.")
        out = Path(sys.argv[2])
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_text(json.dumps({
            "findings": engine.get("findings", []),
            "scan_metadata": engine.get("scan_metadata", {}),
        }, indent=2) + "\n", encoding="utf-8")
        PY
        echo "findings=$GITHUB_WORKSPACE/$SCAN_OUTPUT/findings.json" >> "$GITHUB_OUTPUT"

    - id: scan
      name: Initial security scan
      if: ${{ inputs.reuse-findings != 'true' }}
      shell: bash
      env:
        SCAN_INPUT: ${{ inputs.scan-input }}
        SCAN_OUTPUT: ${{ inputs.scan-output }}
        FULL_REPO_RESCAN: ${{ inputs.full-repo-rescan }}
        PYTHONPATH: ${{ github.action_path }}/../../..
      run: |
        set +e
        if [ "$FULL_REPO_RESCAN" = "true" ]; then
          python3 -m scanner --repo "$GITHUB_WORKSPACE" --model none --format all --output "$GITHUB_WORKSPACE/$SCAN_OUTPUT" --quiet
        else
          python3 -m scanner --repo "$GITHUB_WORKSPACE" --json-input "$GITHUB_WORKSPACE/$SCAN_INPUT" --model none --format all --output "$GITHUB_WORKSPACE/$SCAN_OUTPUT" --quiet
        fi
        rc=$?
        set -e
        if [ "$rc" -gt 1 ]; then exit "$rc"; fi
        test -f "$GITHUB_WORKSPACE/$SCAN_OUTPUT/findings.json"
        echo "findings=$GITHUB_WORKSPACE/$SCAN_OUTPUT/findings.json" >> "$GITHUB_OUTPUT"

    - id: remediate
      name: Generate and apply AI remediation
      if: ${{ inputs.generate-remediation == 'true' }}
      shell: bash
      env:
        FINDINGS: ${{ inputs.reuse-findings == 'true' && steps.canonical.outputs.findings || steps.scan.outputs.findings }}
        OUTPUT: ${{ inputs.remediation-output }}
        MODEL: ${{ inputs.model }}
        CONTEXT_WINDOW: ${{ inputs.context-window }}
        FALLBACK_MODEL: ${{ inputs.fallback-model }}
        PRIMARY_ATTEMPTS: ${{ inputs.primary-attempts }}
        FALLBACK_ATTEMPTS: ${{ inputs.fallback-attempts }}
        GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
        GEMINI_RETRY_ATTEMPTS: "1"
        PYTHONPATH: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        if [ -z "${GEMINI_API_KEY:-}" ]; then echo "GEMINI_API_KEY is required when generate-remediation=true."; exit 1; fi
        python3 "$GITHUB_ACTION_PATH/../../../remediation/retry_pipeline.py" --repo "$GITHUB_WORKSPACE" --findings "$FINDINGS" --output "$GITHUB_WORKSPACE/$OUTPUT" --primary-model "$MODEL" --fallback-model "$FALLBACK_MODEL" --primary-attempts "$PRIMARY_ATTEMPTS" --fallback-attempts "$FALLBACK_ATTEMPTS"
        echo "result=$GITHUB_WORKSPACE/$OUTPUT" >> "$GITHUB_OUTPUT"
