name: Pre-Prod Full Security Pipeline

on:
  workflow_call:
    inputs:
      generate-remediation:
        description: Generate and apply AI remediation, then open a PR.
        required: false
        type: boolean
        default: false
      test-command:
        description: Optional repository test command.
        required: false
        type: string
        default: ""
      fallback-model:
        description: Secondary Gemini model.
        required: false
        type: string
        default: gemini-2.5-flash
      primary-attempts:
        description: Primary Gemini model attempts.
        required: false
        type: string
        default: "3"
      fallback-attempts:
        description: Secondary Gemini model attempts.
        required: false
        type: string
        default: "2"
      full-repo-rescan:
        description: Scan whole repository for PR review.
        required: false
        type: boolean
        default: false
      scan-input:
        description: Canonical scan JSON path produced by Pre-Prod Tester.
        required: false
        type: string
        default: .preprod/scan.json
      source-sha:
        description: Original source commit being remediated.
        required: false
        type: string
        default: ""
      reuse-findings:
        description: Reuse security findings from the canonical scan artifact.
        required: false
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        required: false
    outputs:
      findings:
        description: Baseline findings JSON.
        value: ${{ jobs.security.outputs.findings }}
      remediation:
        description: Remediation result JSON.
        value: ${{ jobs.security.outputs.remediation }}

jobs:
  security:
    runs-on: ubuntu-latest
    outputs:
      findings: ${{ steps.engine.outputs.findings }}
      remediation: ${{ steps.engine.outputs.remediation }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha != '' && 'main' || github.ref }}

      - name: Capture exact push diff
        id: capture
        if: ${{ inputs.source-sha == '' }}
        uses: dis-craft/Pre-prod-tester/.github/actions/capture-diff@main
        with:
          output: .preprod/scan.json

      - name: Prepare canonical scan
        id: canonical_scan
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          CANONICAL_SCAN: ${{ inputs.scan-input }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_SHA" ]; then
            test -f "$CANONICAL_SCAN"
            cp "$CANONICAL_SCAN" "$RUNNER_TEMP/canonical-scan.json"
            git fetch origin "$SOURCE_SHA"
            git checkout --force "$SOURCE_SHA"
            mkdir -p .preprod
            cp "$RUNNER_TEMP/canonical-scan.json" .preprod/scan.json
          else
            test -f "$CANONICAL_SCAN"
          fi

      - name: Run scanner and AI remediation
        id: engine
        uses: dis-craft/Pre-Prod-Orchestrator/.github/actions/security-engine@main
        with:
          scan-input: .preprod/scan.json
          generate-remediation: ${{ inputs.generate-remediation }}
          fallback-model: ${{ inputs.fallback-model }}
          primary-attempts: ${{ inputs.primary-attempts }}
          fallback-attempts: ${{ inputs.fallback-attempts }}
          full-repo-rescan: ${{ inputs.full-repo-rescan }}
          reuse-findings: ${{ inputs.reuse-findings }}

      - name: Enforce security gate for review
        if: ${{ !inputs.generate-remediation }}
        shell: bash
        env:
          FINDINGS: ${{ steps.engine.outputs.findings }}
        run: |
          set -euo pipefail
          python3 - "$FINDINGS" <<'PY'
          import json, sys
          from pathlib import Path

          p = Path(sys.argv[1])
          data = json.loads(p.read_text(encoding="utf-8"))
          findings = data.get("findings", []) if isinstance(data, dict) else data
          blocking = [
              f for f in findings
              if str(f.get("severity", "")).upper() in {"HIGH", "CRITICAL"}
          ]
          print(f"Security review findings: {len(findings)} total, {len(blocking)} HIGH/CRITICAL.")
          if blocking:
              for finding in blocking[:20]:
                  print(
                      f"::error file={finding.get('file','unknown')},line={finding.get('line',1)}::"
                      f"{finding.get('rule','security-rule')} - {finding.get('message','security finding')}"
                  )
              raise SystemExit(1)
          PY
      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: preprod-security-${{ github.sha }}
          path: .preprod/
          if-no-files-found: error
          include-hidden-files: true

      - name: Run repository tests
        if: ${{ inputs.generate-remediation }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TEST_COMMAND" ]; then
            bash -lc "$TEST_COMMAND"
          elif [ -f package-lock.json ]; then
            npm ci
            npm test --if-present
          elif [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -d tests ]; then
            python3 -m pytest -q
          else
            echo "No generic test command detected; relying on scanner validation."
          fi

      - name: Create remediation branch and PR
        if: ${{ inputs.generate-remediation }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes were generated; no remediation PR needed."
            exit 0
          fi
          branch="security/ai-remediation/${SOURCE_SHA::12}"
          git checkout -b "$branch"
          python3 - <<'PY' > "$RUNNER_TEMP/pr-body.md"
          import json, os
          from pathlib import Path
          p = Path('.preprod/remediation-result.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('## AI Security Remediation')
              print()
              print(f"Fixed: **{d.get('fixed', 0)}** / {d.get('findings', 0)} finding(s)")
              print()
              print('Human review is required before merge.')
              print(f'Dashboard: {os.environ.get("DASHBOARD_URL", "")}')
          else:
              print('## AI Security Remediation')
              print('Candidate remediation generated and validated by the security pipeline.')
          PY
          rm -f .preprod/scan.json .preprod/remediation-request.json .preprod/remediation-result.json
          rm -rf .preprod/baseline-scan .preprod/post-remediation-scan
          git config user.name 'pre-prod-tester[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply AI security remediation'
          git push --set-upstream origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title 'fix: AI-generated security remediation' --body-file "$RUNNER_TEMP/pr-body.md"