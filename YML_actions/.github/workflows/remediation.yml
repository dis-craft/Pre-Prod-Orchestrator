name: Pre-prod AI Remediation

on:
  workflow_dispatch:
    inputs:
      generate_remediation:
        description: Generate an AI remediation branch and PR
        required: true
        default: true
        type: boolean
      finding_report:
        description: Path to scanner findings JSON in the workspace
        required: false
        default: .preprod/findings.json
        type: string
      model_name:
        description: Model name to use
        required: false
        default: gemini-2.5-flash
        type: string
  workflow_call:
    inputs:
      generate_remediation:
        required: true
        type: boolean
      finding_report:
        required: true
        type: string
      model_name:
        required: false
        default: gemini-2.5-flash
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  remediation:
    if: ${{ inputs.generate_remediation || github.event.inputs.generate_remediation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai jsonschema requests

      - name: Run Orchestrator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FINDINGS_FILE: ${{ inputs.finding_report || github.event.inputs.finding_report || '.preprod/findings.json' }}
          MODEL_NAME: ${{ inputs.model_name || github.event.inputs.model_name || 'gemini-2.5-flash' }}
        run: |
          set -euo pipefail
          if [ ! -f "$FINDINGS_FILE" ]; then
            echo "Findings report not found: $FINDINGS_FILE"
            exit 1
          fi

          python -m orchestrator \
            --repo . \
            --findings "$FINDINGS_FILE" \
            --base "${GITHUB_REF_NAME:-main}" \
            --model-name "$MODEL_NAME"
