name: Pre-prod Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-and-remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install google-genai jsonschema; fi

      - name: Run Remediation and Create Branch/PR
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Check if findings exist (e.g. from scanner or preprod scan)
          FINDINGS_PATH=".preprod/findings.json"
          if [ ! -f "$FINDINGS_PATH" ]; then
            if [ -f "data/latest.json" ]; then
              FINDINGS_PATH="data/latest.json"
            elif [ -f "reports/report.json" ]; then
              FINDINGS_PATH="reports/report.json"
            fi
          fi

          if [ -f "$FINDINGS_PATH" ]; then
            echo "Running Orchestrator on $FINDINGS_PATH..."
            python -m orchestrator \
              --repo . \
              --findings "$FINDINGS_PATH" \
              --base "${GITHUB_REF_NAME:-main}"
          else
            echo "No findings JSON found to remediate."
          fi

